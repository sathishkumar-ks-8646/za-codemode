### CI for za-codemode.
#
# Three things are checked, in rising order of how often they break:
#
#   1. The test suite — 144 tests, fully offline against the mock Analytics API.
#   2. The guide validates — every page has an H1 and every internal link and
#      anchor resolves.
#   3. The rendered HTML matches the authored Markdown. The `.html` files are
#      generated and committed, so a doc change that edits only the `.md` leaves
#      the published guide stale. Re-rendering and diffing is the only way to
#      catch that before a reader does.
#
# isolated-vm is a native addon, and the Node versions tested here are exactly
# the ones it ships a prebuilt binary for. isolated-vm 6.2.0 carries abi127
# (Node 22) and abi137 (Node 24) for linux-x64, so `npm ci` needs no toolchain;
# `--foreground-scripts` makes a fallback compile visible rather than silent.
#
# Node 20 was tested here until it was removed on 2026-11-24. It never passed:
# there is no abi115 prebuild, so npm fell back to compiling from source, and
# the source uses `v8::SourceLocation`, which does not exist before Node 22 —
# an unbuildable combination, not a flake. Node 20 also reached end of life on
# 2026-04-30, and no isolated-vm 6.x supports it (the last one that did is
# 5.0.4, two majors back). Do not add it back; add the next LTS instead.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The @utcp/* packages are not mirrored on internal registries; .npmrc
      # pins the public one. --foreground-scripts surfaces the native build.
      - name: Install
        run: npm ci --foreground-scripts

      - name: Verify the sandbox engine loaded
        run: node -e "import('isolated-vm').then(()=>console.log('isolated-vm ok'))"

      - name: Test
        run: npm test

  guide:
    name: Guide
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate links, anchors and headings
        run: python3 guide/build.py --check

      # The footer carries the render date, so every re-render touches all
      # eleven files. -I ignores hunks whose every changed line matches that pattern,
      # leaving real content drift to fail the job.
      # --single also rebuilds za-codemode-how-to-use.html, the one-file
      # edition that gets published on its own. Without the flag that file
      # would quietly keep an older copy of the guide.
      - name: Rendered HTML is in step with the Markdown
        run: |
          python3 guide/build.py --single
          if ! git diff -I'Generated [0-9]{4}-[0-9]{2}-[0-9]{2}\.' \
                        --exit-code --stat -- guide/; then
            echo
            echo "::error::guide/*.html is stale. Run 'cd guide && python3 build.py' and commit the result."
            exit 1
          fi
